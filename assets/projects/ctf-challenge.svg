<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ctf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f22" />
      <stop offset="60%" stop-color="#0c0912" />
      <stop offset="100%" stop-color="#08070b" />
    </linearGradient>
    <linearGradient id="ctf-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C594F5" />
      <stop offset="100%" stop-color="#A46BEE" />
    </linearGradient>
    <filter id="ctf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#ctf-bg)" rx="16" />
  <rect width="800" height="500" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" rx="16" />

  <!-- Ambient Glow -->
  <circle cx="250" cy="180" r="130" fill="#A46BEE" opacity="0.12" filter="url(#ctf-glow)" />
  <circle cx="650" cy="350" r="120" fill="#C594F5" opacity="0.08" filter="url(#ctf-glow)" />

  <!-- Header -->
  <line x1="0" y1="52" x2="800" y2="52" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="36" cy="26" r="5" fill="#3a3447" />
  <circle cx="54" cy="26" r="5" fill="#3a3447" />
  <circle cx="72" cy="26" r="5" fill="#3a3447" />
  <text x="100" y="31" fill="#7E768E" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">CAPTURE THE FLAG // CHALLENGE SUITE</text>
  <rect x="654" y="16" width="112" height="20" rx="10" fill="rgba(164,107,238,0.15)" stroke="rgba(164,107,238,0.4)" stroke-width="1" />
  <text x="710" y="30" fill="#C594F5" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">WEB EXPLOIT</text>

  <!-- Matrix / Hash Grid Cards -->
  <g opacity="0.18">
    <text x="80" y="100" fill="#A46BEE" font-family="monospace" font-size="11">01000011 01010100 01000110</text>
    <text x="80" y="125" fill="#A46BEE" font-family="monospace" font-size="11">5f 63 79 62 65 72 5f 73 65 63</text>
    <text x="80" y="150" fill="#A46BEE" font-family="monospace" font-size="11">SHA256: e3b0c44298fc1c149afb</text>
  </g>

  <!-- Central CTF Card -->
  <rect x="180" y="110" width="440" height="240" rx="14" fill="#120e1c" stroke="rgba(164,107,238,0.25)" stroke-width="1.5" />
  
  <!-- Flag Emblem -->
  <circle cx="400" cy="180" r="38" fill="#1b1429" stroke="url(#ctf-neon)" stroke-width="2" />
  <!-- Flag Icon -->
  <path d="M388 198 V 162 M388 164 H 414 L 406 174 L 414 184 H 388" fill="none" stroke="#C594F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <text x="400" y="245" fill="#F3EFF8" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">flag{b4s1c_xss_t0_csrf}</text>
  <text x="400" y="270" fill="#AAA3B5" font-family="Inter, -apple-system, sans-serif" font-size="12" text-anchor="middle">Hands-on Web Security Labs & Walkthroughs</text>

  <rect x="260" y="295" width="280" height="28" rx="6" fill="#1a1426" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <text x="400" y="314" fill="#C594F5" font-family="monospace" font-size="11" text-anchor="middle">Status: Writeups & Solutions Pending</text>

  <!-- Bottom placeholder banner -->
  <rect x="220" y="385" width="360" height="48" rx="8" fill="#120e1a" stroke="rgba(164,107,238,0.3)" stroke-width="1" />
  <circle cx="245" cy="409" r="5" fill="#A46BEE" />
  <text x="262" y="413" fill="#F3EFF8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">CHALLENGE WRITEUP REPOSITORY</text>
  <text x="525" y="413" fill="#C594F5" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500">Coming Soon</text>
</svg>

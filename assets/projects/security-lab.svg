<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e1a" />
      <stop offset="50%" stop-color="#0c0912" />
      <stop offset="100%" stop-color="#08070b" />
    </linearGradient>
    <linearGradient id="purple-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A46BEE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C594F5" stop-opacity="0.2" />
    </linearGradient>
    <filter id="sec-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sec-bg)" rx="16" />
  <rect width="800" height="500" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" rx="16" />

  <!-- Ambient light -->
  <circle cx="400" cy="250" r="150" fill="#A46BEE" opacity="0.1" filter="url(#sec-blur)" />
  <circle cx="700" cy="120" r="100" fill="#C594F5" opacity="0.06" filter="url(#sec-blur)" />

  <!-- Top bar -->
  <line x1="0" y1="52" x2="800" y2="52" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="36" cy="26" r="5" fill="#3a3447" />
  <circle cx="54" cy="26" r="5" fill="#3a3447" />
  <circle cx="72" cy="26" r="5" fill="#3a3447" />
  <text x="100" y="31" fill="#7E768E" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">SECURITY LAB // AUDIT WORKBENCH</text>
  <rect x="650" y="16" width="116" height="20" rx="10" fill="rgba(164,107,238,0.12)" stroke="rgba(164,107,238,0.3)" stroke-width="1" />
  <text x="708" y="30" fill="#C594F5" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RESEARCH NOTES</text>

  <!-- Terminal window in center -->
  <rect x="80" y="90" width="640" height="340" rx="12" fill="#0f0c16" stroke="rgba(164,107,238,0.2)" stroke-width="1.5" />

  <!-- Terminal header line -->
  <line x1="80" y1="130" x2="720" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <text x="104" y="116" fill="#A46BEE" font-family="monospace" font-size="12">user@sec-lab:~$ nmap -sS -T4 target.lan</text>

  <!-- Topology network lines -->
  <circle cx="200" cy="220" r="28" fill="#171224" stroke="#A46BEE" stroke-width="1.5" />
  <text x="200" y="224" fill="#F3EFF8" font-family="monospace" font-size="11" text-anchor="middle">GATEWAY</text>

  <line x1="228" y1="220" x2="350" y2="180" stroke="rgba(164,107,238,0.4)" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="228" y1="220" x2="350" y2="260" stroke="rgba(164,107,238,0.4)" stroke-width="1.5" stroke-dasharray="4 4" />

  <circle cx="380" cy="180" r="24" fill="#171224" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="380" y="184" fill="#AAA3B5" font-family="monospace" font-size="10" text-anchor="middle">NODE-A</text>

  <circle cx="380" cy="260" r="24" fill="#171224" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="380" y="264" fill="#AAA3B5" font-family="monospace" font-size="10" text-anchor="middle">NODE-B</text>

  <line x1="404" y1="180" x2="520" y2="220" stroke="rgba(164,107,238,0.4)" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="404" y1="260" x2="520" y2="220" stroke="rgba(164,107,238,0.4)" stroke-width="1.5" stroke-dasharray="4 4" />

  <circle cx="550" cy="220" r="30" fill="#201733" stroke="#C594F5" stroke-width="2" />
  <text x="550" y="224" fill="#C594F5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">HONEYPOT</text>

  <!-- Clear "Preview Coming Soon" center overlay banner -->
  <rect x="220" y="330" width="360" height="48" rx="8" fill="#140f21" stroke="#A46BEE" stroke-width="1" />
  <circle cx="245" cy="354" r="5" fill="#A46BEE" />
  <text x="262" y="358" fill="#F3EFF8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">RESEARCH NOTES IN PROGRESS</text>
  <text x="525" y="358" fill="#C594F5" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500">Coming Soon</text>
</svg>
